{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DGME Nicaragua - Pasaportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- Navbar Institucional -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#3973a3;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">DGME Nicaragua</a>
  </div>
</nav>

<!-- Hero Banner -->
<section class="py-4 text-white" style="background-color:#3973a3;">
  <div class="container text-center">
    <!-- Logo DGME -->
    <img src="{% static 'citas/img/logo_dgme.png' %}" 
         alt="Logo DGME" 
         class="img-fluid mb-3" 
         style="max-height:70px;">
    <!-- Título -->
    <h1 class="fw-bold">Solicitud y Agendamiento de Citas para Pasaporte</h1>
  </div>
</section>

<!-- Progreso (Stepper) -->
<div class="container my-4">
  <div class="d-flex justify-content-center">
    <div class="stepper d-flex">
      <div class="p-2 text-center">
        <span class="badge bg-primary">1</span><br>Paso 1
      </div>
      <div class="p-2 text-center">
        <span class="badge bg-primary">2</span><br>Paso 2
      </div>
      <div class="p-2 text-center">
        <span class="badge bg-primary">3</span><br>Paso 3
      </div>
    </div>
  </div>
</div>

<!-- Contenido Principal -->
<main class="container my-5">
    {% block content %}
    {% endblock %}
</main>

<!-- Footer Institucional -->
<footer class="text-center py-3 text-white" style="background-color:#3973a3;">
  <p class="mb-0">© 2026 Dirección General de Migración y Extranjería - Nicaragua</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
